<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P1_059</title>
    <style>

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container{
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Kalkulator Sederhana</h1>

        <button type="button" onclick="mulaiKalklator()">Mulai Kalkulator</button>
        <h4>P1_059</h4>
        <div id="hasil"></div>
    </div>

    <script>
        function mulaiKalklator(){
            //minta input tanpa spasi
            const input = prompt("Masukkan operasi (contoh: 2+3, 4-1, 5*2, 10/2): ");
            if (!input) {
                alert("Operasi dibatalkan!");
                return;
            }

            const match = input.match(/^(\d+)([\+\-\*\/])(\d+)$/);

            if (!match) {
                alert("Format input tidak valid! Gunakan format: angka1+angka2");
                return;
            }

            const angka1 = parseFloat(match[1]);
            const operasi = match[2];
            const angka2 = parseFloat(match[3]);
            let hasil;

            switch(operasi) {
                case '+':
                    hasil = angka1 + angka2;
                    break;
                case '-':
                    hasil = angka1 - angka2;
                    break;
                case '*':
                    hasil = angka1 * angka2;
                    break;
                case '/':
                    if (angka2 === 0){
                    alert ("tidak bisa membagi dengan 0");
                    return;
                    }
                    hasil = angka1 / angka2;
                    break;
                default:
                    alert("Operasi tidak dikenali!");
                    return;
            }

            alert(`Hasil: ${hasil}`);
        }
    </script>
</body>

</html>
